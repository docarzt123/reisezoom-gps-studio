<!-- ══ v0.9.446 — START-DIAGNOSE ══════════════════════════════════════════
     MUSS als ERSTES Script laufen und ist bewusst reines ES5 (kein let/const,
     keine Arrow-Functions, kein optional chaining). Grund: wenn eine spätere
     Datei gar nicht lädt ODER moderne Syntax auf einer alten WebKit-Version
     nicht geparst werden kann, ist dieses Script die letzte Instanz, die dem
     Nutzer noch etwas Lesbares zeigen kann — statt eines weißen Fensters.
     Es meldet den Fehler zusätzlich ins app.log (über die pywebview-Bridge). -->
<script>
(function () {
  var shown = false;
  window.__rzBooted = false;
  // v0.9.472 — true, solange der First-Run-Dialog (Mapbox-Token) berechtigt auf den
  // Nutzer wartet. Der Watchdog wertet DAS NICHT als „hängt" (sonst legt sich der
  // „konnte nicht starten"-Screen über den Dialog, wenn ein DAU >25 s überlegt).
  window.__rzOnboarding = false;
  window.__rzStartErrors = [];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // ── Sprache im Notfall (28.08.2026) ────────────────────────────────────
  // Dieser Bildschirm erscheint, WEIL die Oberfläche nicht geladen hat — also
  // gibt es weder i18n noch Einstellungen. Trotzdem darf er nicht deutsch
  // bleiben: Er richtet sich an genau die Nutzer, die gerade nicht
  // weiterkommen, und ein spanischer Beta-Tester steht sonst vor deutschen
  // Anweisungen. Deshalb eine winzige eigene Tabelle, bewusst ES5 wie der Rest
  // dieses Blocks, Sprache aus `navigator.language` (das kennt der Browser
  // ohne unsere Einstellungen). Unbekannte Sprache → Englisch.
  // sprache-ok-anfang (dies IST die Übersetzung, kein vergessener Text)
  var RZ_TXT = {
    de: {
      titel: 'GPS Studio konnte nicht starten',
      sub_translo: 'Fast geschafft — es fehlt nur der letzte Installations-Schritt.',
      sub_fehler: 'Die Programmoberfläche konnte nicht geladen werden.',
      tr_kopf: '⚠️ Die App muss noch richtig installiert werden',
      tr_text: 'macOS führt die App gerade aus einem geschützten Ordner aus, weil sie direkt aus dem Download-Fenster gestartet wurde — deshalb meldet sie „beschädigt". So läuft sie wieder:',
      tr_1: 'Dieses Fenster schließen.',
      tr_2: 'Das Download-Fenster mit dem <b>Reisezoom-Symbol</b> öffnen und das Symbol <b>in den Ordner „Programme" ziehen</b> — nicht doppelklicken, sondern rüberziehen.',
      tr_3: 'Die App danach aus dem <b>Programme-Ordner</b> (oder Launchpad) starten. Beim ersten Mal ggf. <b>Rechtsklick → „Öffnen"</b>.',
      log_kopf: 'Klappt es trotzdem nicht? Schick uns den Log',
      log_text: 'Der Log zeigt genau, was schiefgelaufen ist — am einfachsten so:',
      log_desktop: '📄 Log auf den Schreibtisch legen',
      log_ordner: '📂 Log-Ordner öffnen',
      log_fuss: 'Der Schreibtisch-Knopf legt eine Datei <b>Reisezoom-GPS-Studio-Log….txt</b> auf deinen Schreibtisch — die kannst du einfach in die Mail an Marc ziehen. Bitte zusammen mit einem Screenshot von <b>Apple-Menü → „Über diesen Mac"</b> — damit ist das Problem meist sofort klar.',
      log_ok: '✓ Liegt auf dem Schreibtisch — in die Mail ziehen',
      log_fehler: 'Konnte den Log nicht ablegen. Bitte „📂 Log-Ordner öffnen" nutzen und die Datei app.log von Hand anhängen.',
      pfad_manuell: 'Bitte den Pfad manuell im Finder öffnen:'
    },
    en: {
      titel: 'GPS Studio could not start',
      sub_translo: 'Almost there — only the last installation step is missing.',
      sub_fehler: 'The program interface could not be loaded.',
      tr_kopf: '⚠️ The app still needs to be installed properly',
      tr_text: 'macOS is running the app from a protected folder because it was started straight from the download window — that is why it reports "damaged". This gets it running again:',
      tr_1: 'Close this window.',
      tr_2: 'Open the download window with the <b>Reisezoom icon</b> and <b>drag the icon into the "Applications" folder</b> — drag it, do not double-click it.',
      tr_3: 'Then start the app from the <b>Applications folder</b> (or Launchpad). The first time you may need <b>right-click → "Open"</b>.',
      log_kopf: 'Still not working? Send us the log',
      log_text: 'The log shows exactly what went wrong — easiest this way:',
      log_desktop: '📄 Put the log on the desktop',
      log_ordner: '📂 Open the log folder',
      log_fuss: 'The desktop button puts a file <b>Reisezoom-GPS-Studio-Log….txt</b> on your desktop — just drag it into an email to Marc. Please add a screenshot of <b>Apple menu → "About This Mac"</b>; that usually makes the problem obvious.',
      log_ok: '✓ On your desktop — drag it into the email',
      log_fehler: 'Could not save the log. Please use "📂 Open the log folder" and attach app.log by hand.',
      pfad_manuell: 'Please open the path manually in Finder:'
    },
    es: {
      titel: 'GPS Studio no ha podido arrancar',
      sub_translo: 'Casi está: solo falta el último paso de la instalación.',
      sub_fehler: 'No se ha podido cargar la interfaz del programa.',
      tr_kopf: '⚠️ La aplicación todavía no está bien instalada',
      tr_text: 'macOS está ejecutando la aplicación desde una carpeta protegida porque se abrió directamente desde la ventana de descargas; por eso dice que está «dañada». Así vuelve a funcionar:',
      tr_1: 'Cierra esta ventana.',
      tr_2: 'Abre la ventana de descarga con el <b>icono de Reisezoom</b> y <b>arrastra el icono a la carpeta «Aplicaciones»</b>: arrástralo, no hagas doble clic.',
      tr_3: 'Después inicia la aplicación desde la <b>carpeta Aplicaciones</b> (o el Launchpad). La primera vez quizá necesites <b>clic derecho → «Abrir»</b>.',
      log_kopf: '¿Sigue sin funcionar? Mándanos el registro',
      log_text: 'El registro muestra exactamente qué ha fallado; lo más sencillo es así:',
      log_desktop: '📄 Dejar el registro en el escritorio',
      log_ordner: '📂 Abrir la carpeta del registro',
      log_fuss: 'El botón del escritorio deja un archivo <b>Reisezoom-GPS-Studio-Log….txt</b> en tu escritorio; solo tienes que arrastrarlo al correo para Marc. Añade también una captura de <b>menú Apple → «Acerca de este Mac»</b>: con eso el problema suele verse enseguida.',
      log_ok: '✓ Está en el escritorio: arrástralo al correo',
      log_fehler: 'No se ha podido guardar el registro. Usa «📂 Abrir la carpeta del registro» y adjunta app.log a mano.',
      pfad_manuell: 'Abre la ruta manualmente en el Finder:'
    }
  };
  // sprache-ok-ende
  function rzSprache() {
    try {
      var l = String(navigator.language || 'en').slice(0, 2).toLowerCase();
      return RZ_TXT[l] ? l : 'en';
    } catch (e) { return 'en'; }
  }
  var TX = RZ_TXT[rzSprache()];

  function logPath() {
    var p = (navigator.platform || '') + ' ' + (navigator.userAgent || '');
    if (/Win/i.test(p)) return '%APPDATA%\\Reisezoom GPS Studio\\logs\\app.log';
    if (/Mac|iPhone|iPad/i.test(p)) return '~/Library/Application Support/Reisezoom GPS Studio/logs/app.log';
    return '~/.local/share/Reisezoom GPS Studio/logs/app.log';
  }
  // v0.9.496 — Die Meldung hieß IMMER „STARTFEHLER", auch wenn der Fehler eine
  // halbe Stunde nach dem Start auftrat. Im Bug-Report von Martin W. standen
  // deshalb „STARTFEHLER"-Zeilen mitten in einer laufenden Sitzung, und die
  // Fehlersuche lief erst einmal in die falsche Richtung. Jetzt sagt die Zeile,
  // wann es passiert ist.
  function toBackend(msg, nachStart) {
    try {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.log_js) {
        window.pywebview.api.log_js('error',
          (nachStart ? 'JS-FEHLER (im Betrieb): ' : 'STARTFEHLER: ') + msg);
      }
    } catch (e) {}
  }

  // v0.9.472 — Anleitung, wenn macOS die App aus einem gesperrten Ordner ausführt
  // (App Translocation: App wurde direkt aus DMG/Downloads gestartet statt aus
  // /Programme). Das ist der häufigste „beschädigt"-Fall beim Beta-Tester.
  function transloBanner() {
    return '<div style="background:#3a2a10;border:1px solid #ff6b35;border-radius:8px;padding:14px 16px;margin-bottom:22px">' +
      '<div style="font-size:16px;font-weight:700;color:#ffb38a;margin-bottom:8px">' + TX.tr_kopf + '</div>' +
      '<div style="color:#e6c9b3;font-size:13px;margin-bottom:10px">' + TX.tr_text + '</div>' +
      '<ol style="color:#e6c9b3;font-size:13px;margin:0;padding-left:18px;line-height:1.75">' +
        '<li>' + TX.tr_1 + '</li>' +
        '<li>' + TX.tr_2 + '</li>' +
        '<li>' + TX.tr_3 + '</li>' +
      '</ol>' +
    '</div>';
  }

  window.__rzShowStartError = function (title, detail) {
    window.__rzStartErrors.push(title + ' | ' + detail);
    toBackend(title + ' | ' + detail);
    if (shown) return;
    shown = true;

    var BTN = 'font:600 13px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;' +
      'border:0;border-radius:8px;padding:9px 15px;cursor:pointer;margin-right:8px;margin-bottom:8px;';
    var lp = logPath();
    // Translocation erkennen: der fehlgeschlagene Datei-Pfad im Fehlertext enthält
    // dann „/AppTranslocation/". (Zusätzlich fragen wir unten das Backend, falls der
    // Fehler ohne Pfad kam — z. B. Zeitüberschreitung.)
    var isTranslo = /AppTranslocation/i.test(String(detail || ''));

    var box = document.createElement('div');
    box.id = 'rz-start-error';
    box.setAttribute('style',
      'position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;' +
      'background:#0e1117;color:#c9d1d9;overflow:auto;padding:30px 22px;' +
      'font:14px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif');
    box.innerHTML =
      '<div style="max-width:640px;margin:0 auto">' +
        '<div style="font-size:21px;font-weight:700;color:#fff;margin-bottom:6px">' +
          TX.titel + '</div>' +
        '<div style="color:#8b949e;margin-bottom:20px" id="rz-se-sub">' +
          (isTranslo ? TX.sub_translo : TX.sub_fehler) + '</div>' +
        '<div id="rz-translo">' + (isTranslo ? transloBanner() : '') + '</div>' +
        '<div style="background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px 14px;margin-bottom:22px">' +
          '<div style="color:#ff6b35;font-weight:600;margin-bottom:4px">' + esc(title) + '</div>' +
          '<div style="color:#8b949e;font-size:12.5px;word-break:break-word">' + esc(detail) + '</div>' +
        '</div>' +
        '<div style="font-weight:600;color:#fff;margin-bottom:6px" id="rz-se-loghead">' + TX.log_kopf + '</div>' +
        '<div style="margin-bottom:12px">' + TX.log_text + '</div>' +
        '<div style="margin-bottom:12px">' +
          '<button id="rz-desktop-log" style="' + BTN + 'background:#ff6b35;color:#fff">' + TX.log_desktop + '</button>' +
          '<button id="rz-open-log" style="' + BTN + 'background:#21262d;color:#c9d1d9">' + TX.log_ordner + '</button>' +
        '</div>' +
        '<div style="color:#8b949e;font-size:12.5px;border-top:1px solid #30363d;padding-top:14px">' +
          TX.log_fuss +
        '</div>' +
      '</div>';
    (document.body || document.documentElement).appendChild(box);

    // v0.9.472 — DAU-sicher: kompletten Log als Datei auf den Schreibtisch legen.
    var db = document.getElementById('rz-desktop-log');
    if (db) db.onclick = function () {
      db.disabled = true;
      function failMsg() { db.disabled = false; alert(TX.log_fehler); }
      try {
        var pr = window.pywebview.api.save_log_to_desktop();
        if (pr && pr.then) {
          pr.then(function (res) {
            if (res && res.ok) { db.textContent = TX.log_ok; }
            else { failMsg(); }
          }).catch(failMsg);
        } else { db.textContent = TX.log_ok; }
      } catch (e) { failMsg(); }
    };
    var ob = document.getElementById('rz-open-log');
    if (ob) ob.onclick = function () {
      try { window.pywebview.api.open_log(); }
      catch (e) { alert(TX.pfad_manuell + '\n\n' + lp); }
    };

    // v0.9.472 — kam der Fehler ohne AppTranslocation-Pfad im Text (z. B.
    // Zeitüberschreitung), trotzdem das Backend fragen und die Anleitung nachziehen.
    if (!isTranslo) {
      try {
        var api = window.pywebview && window.pywebview.api;
        if (api && api.startup_env) {
          var q = api.startup_env();
          if (q && q.then) q.then(function (env) {
            if (env && env.translocated) {
              var slot = document.getElementById('rz-translo');
              if (slot && !slot.innerHTML) slot.innerHTML = transloBanner();
              var sub = document.getElementById('rz-se-sub');
              if (sub) sub.textContent = 'Fast geschafft — es fehlt nur der letzte Installations-Schritt.';
            }
          }).catch(function () {});
        }
      } catch (e) {}
    }
  };

  // WICHTIG: Der Fehler-Bildschirm erscheint NUR solange die Oberfläche noch nicht
  // steht (__rzBooted). Sonst würde ein harmloser später Fehler die laufende App
  // zudecken. Ins app.log wandert der Fehler aber IMMER.
  function fail(title, detail) {
    if (window.__rzBooted) { toBackend(title + ' | ' + detail, true); return; }
    window.__rzShowStartError(title, detail);
  }

  // 1) Klassische JS-Fehler (inkl. Syntaxfehler in nachgeladenen Dateien)
  window.onerror = function (msg, src, line) {
    fail('JavaScript-Fehler beim Start',
      msg + (src ? ('  —  ' + String(src).split('/').pop() + ':' + line) : ''));
    return false;
  };
  // 2) Datei konnte gar nicht geladen werden (<script>/<link> 404 o. ä.).
  //    Resource-Fehler steigen nicht zu window.onerror auf → Capture-Phase.
  window.addEventListener('error', function (e) {
    var el = e && e.target;
    if (el && (el.tagName === 'SCRIPT' || el.tagName === 'LINK')) {
      fail('Programmdatei fehlt oder ist beschädigt',
        'Nicht ladbar: ' + (el.src || el.href || '?') +
        '  —  Bitte die App neu aus dem Original-Download installieren.');
    }
  }, true);
  // 3) Abgelehnte Promises — der Start läuft async, ein Fehler darin landet
  //    NICHT bei window.onerror. Häufigster echter Startfehler.
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    fail('Fehler beim Initialisieren',
      (r && (r.message || r)) ? String(r.message || r) : 'Unbekannter Fehler');
  });
  // 4) Watchdog: nichts abgestürzt, aber die Oberfläche kommt trotzdem nicht hoch
  //    (z. B. hängende Netzwerk-Anfrage) → nach 25 s trotzdem etwas Lesbares zeigen.
  //    v0.9.472 — ABER: der First-Run-Dialog (Mapbox-Token) wartet BERECHTIGT auf den
  //    Nutzer. Solange der offen ist (__rzOnboarding), NICHT als „hängt" werten, sonst
  //    knallt sich der Fehlerscreen über den Dialog (DAU überlegt >25 s → „konnte nicht
  //    starten", Beta-Tester-Bug). Ist der Dialog offen, warten wir weitere 25 s — die
  //    Uhr für den Rest-Boot läuft erst weiter, wenn der Nutzer entschieden hat.
  (function watchdog() {
    setTimeout(function () {
      if (window.__rzBooted) return;
      if (window.__rzOnboarding) { watchdog(); return; }
      window.__rzShowStartError('Zeitüberschreitung beim Laden',
        'Die Oberfläche hat sich nach 25 Sekunden nicht gemeldet.');
    }, 25000);
  })();
})();
</script>
